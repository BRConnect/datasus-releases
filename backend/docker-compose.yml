services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: survey
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - survey_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d survey"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "3333:3333"
    networks:
      - survey_internal
networks:
  survey_internal:
volumes:
  survey_postgres_data:
