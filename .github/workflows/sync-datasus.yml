name: Sincronizar releases DATASUS

on:
  schedule:
    # 07:00 em Brasília (UTC-3) = 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: datasus-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter código do catálogo
        uses: actions/checkout@v5

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Consultar fontes, baixar e publicar releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sync_branch="automation/datasus-sync"

          for attempt in 1 2 3; do
            echo "Sincronização/publicação tentativa ${attempt}/3."
            git fetch origin main
            # Atualiza o lease local da branch de publicação. Sem este fetch,
            # --force-with-lease rejeita a primeira execução após uma branch
            # automática já ter sido criada por uma tentativa anterior.
            git fetch origin "+refs/heads/${sync_branch}:refs/remotes/origin/${sync_branch}" || true
            git checkout -B "${sync_branch}" origin/main
            bun run check
            bun run test
            bun run sync:datasus

            if git diff --quiet -- public/releases.json; then
              echo "Manifesto sem alterações."
              exit 0
            fi

            git add public/releases.json
            git commit -m "chore: sincronizar releases DATASUS"
            git push --force-with-lease origin "HEAD:${sync_branch}"

            if gh pr view "${sync_branch}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "PR de sincronização já existe; branch atualizada."
              exit 0
            fi

            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${sync_branch}" \
              --title "chore: sincronizar releases DATASUS" \
              --body "Atualização automática do manifesto a partir das fontes oficiais DATASUS. Este PR será validado pela CI antes do merge."
            echo "PR de sincronização criado com sucesso."
            exit 0
          done

          echo "Não foi possível publicar o manifesto após 3 tentativas."
          exit 1
