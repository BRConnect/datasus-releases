name: Sincronizar releases DATASUS

on:
  schedule:
    # 07:00 em Brasília (UTC-3) = 10:00 UTC
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datasus-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter código do catálogo
        uses: actions/checkout@v5

      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Consultar fontes, baixar e publicar releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Sincronização/publicação tentativa ${attempt}/3."
            git fetch origin main
            git reset --hard origin/main
            bun run sync:datasus

            if git diff --quiet -- public/releases.json; then
              echo "Manifesto sem alterações."
              exit 0
            fi

            git add public/releases.json
            git commit -m "chore: sincronizar releases DATASUS"
            if git push origin HEAD:main; then
              echo "Manifesto publicado com sucesso."
              exit 0
            fi

            echo "Push rejeitado por alteração concorrente; refazendo fetch e sincronização."
          done

          echo "Não foi possível publicar o manifesto após 3 tentativas."
          exit 1
